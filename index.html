
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pink Moment ♡</title>

  <!-- EXIF metadata editor -->
  <script src="https://cdn.jsdelivr.net/npm/piexifjs@1.0.6/piexif.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(145deg, #fff0f6, #fce1ef, #f8d7ff);
      font-family: Arial, sans-serif;
      color: #713c59;
    }

    .app {
      width: 100%;
      max-width: 390px;
      padding: 25px 20px;
      text-align: center;
      background: rgba(255,255,255,.78);
      border: 1px solid #fff;
      border-radius: 28px;
      box-shadow: 0 15px 45px #c77ba533;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 27px;
      color: #d94d91;
    }

    .subtitle {
      margin: 0 0 22px;
      color: #9c6c88;
      font-size: 14px;
    }

    .camera-frame {
      width: min(78vw, 290px);
      aspect-ratio: 1;
      margin: 0 auto 20px;
      border-radius: 50%;
      overflow: hidden;
      position: relative;
      background: #f8d8e9;
      border: 6px solid white;
      outline: 2px solid #f0a3ca;
      box-shadow: 0 8px 24px #c96ba333;
    }

    video, .preview, .placeholder {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    video, .preview {
      display: block;
    }

    .preview[hidden], video[hidden], .placeholder[hidden] {
      display: none;
    }

    .placeholder {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 12px;
      padding: 24px;
      color: #b34e87;
    }

    .placeholder .heart { font-size: 44px; }

    button {
      width: 100%;
      border: 0;
      padding: 14px 18px;
      margin: 6px 0;
      border-radius: 30px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      background: #ed72ac;
      color: white;
      box-shadow: 0 5px 14px #d9579530;
    }

    button.secondary {
      background: #f8e2ee;
      color: #a44479;
    }

    button:disabled {
      opacity: .55;
      cursor: wait;
    }

    .consent {
      display: flex;
      gap: 9px;
      text-align: left;
      font-size: 13px;
      line-height: 1.5;
      margin: 12px 2px;
      align-items: flex-start;
    }

    .consent input {
      margin-top: 3px;
      accent-color: #dc5597;
    }

    .status {
      min-height: 38px;
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
      color: #925b7b;
    }

    .tiny {
      font-size: 11px;
      line-height: 1.5;
      color: #a17b94;
      margin-top: 14px;
    }

    [hidden] { display: none !important; }
  </style>
</head>

<body>
  <main class="app">
    <h1>Pink Moment ♡</h1>
    <p class="subtitle">Click any object ♡</p>

    <div class="camera-frame">
      <video id="camera" autoplay playsinline></video>

      <img id="preview" class="preview" alt="Photo preview" hidden>

      <div id="placeholder" class="placeholder" hidden>
        <span class="heart">♡</span>
        <span>Your moment awaits</span>
      </div>
    </div>

    <button id="startBtn">Open Camera ♡</button>
    <button id="takeBtn" hidden>Capture Photo</button>
    <button id="retakeBtn" class="secondary" hidden>Retake Photo</button>

    <label id="consentLabel" class="consent" hidden>
      <input type="checkbox" id="consent">
      <span>I agree to send this photo and its GPS location to the configured Telegram chat.</span>
    </label>

    <button id="sendBtn" hidden disabled>Send Photo ♡</button>

    <div id="status" class="status" role="status">
      Open the camera to begin.
    </div>

    <p class="tiny">
      GPS access requires your permission. Review your photo before sending.
      Only share location data when you are comfortable doing so.
    </p>
  </main>

  <script>
    // ==========================================
    // TELEGRAM CONFIGURATION
    // ==========================================
    const BOT_TOKEN = "8799702650:AAH4KcrkJaFVVxlEAA6JkoepemAv2PRx_ZM";
    const CHAT_ID = "7350437667";

    // ==========================================
    // ELEMENTS AND STATE
    // ==========================================
    const camera = document.getElementById("camera");
    const preview = document.getElementById("preview");
    const placeholder = document.getElementById("placeholder");
    const startBtn = document.getElementById("startBtn");
    const takeBtn = document.getElementById("takeBtn");
    const retakeBtn = document.getElementById("retakeBtn");
    const sendBtn = document.getElementById("sendBtn");
    const consent = document.getElementById("consent");
    const consentLabel = document.getElementById("consentLabel");
    const status = document.getElementById("status");

    let stream = null;
    let imageCapture = null;
    let photoBlob = null;
    let photoUrl = null;
    let capturedLocation = null;

    function setStatus(message) {
      status.textContent = message;
    }

    function updateSend() {
      sendBtn.disabled = !(
        photoBlob &&
        capturedLocation &&
        consent.checked
      );
    }

    function revokePreviewUrl() {
      if (photoUrl) {
        URL.revokeObjectURL(photoUrl);
        photoUrl = null;
      }
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      imageCapture = null;
      camera.srcObject = null;
    }

    function resetPhoto() {
      photoBlob = null;
      capturedLocation = null;
      revokePreviewUrl();

      preview.removeAttribute("src");
      preview.hidden = true;
      consent.checked = false;
      consentLabel.hidden = true;
      sendBtn.hidden = true;
      sendBtn.disabled = true;
      retakeBtn.hidden = true;
      takeBtn.hidden = true;
      startBtn.hidden = false;
      camera.hidden = true;
      placeholder.hidden = false;
    }

    // ==========================================
    // OPEN CAMERA
    // ==========================================
    async function openCamera() {
      try {
        stopCamera();
        resetPhoto();

        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error(
            "Camera unavailable. Open this website using HTTPS in Chrome."
          );
        }

        setStatus("Opening camera... ♡");

        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 4096 },
            height: { ideal: 3072 }
          }
        });

        camera.srcObject = stream;
        camera.hidden = false;
        placeholder.hidden = true;

        await camera.play();

        const track = stream.getVideoTracks()[0];

        if ("ImageCapture" in window) {
          try {
            imageCapture = new ImageCapture(track);
          } catch (_) {
            imageCapture = null;
          }
        }

        startBtn.hidden = true;
        takeBtn.hidden = false;

        if (!imageCapture) {
          setStatus(
            "Still-photo capture is unsupported in this browser. Try Chrome on Android."
          );
        } else {
          setStatus("Camera ready. Tap Capture Photo ♡");
        }
      } catch (error) {
        stopCamera();
        camera.hidden = true;
        placeholder.hidden = false;
        startBtn.hidden = false;
        takeBtn.hidden = true;
        setStatus(error.message || "Could not open the camera.");
      }
    }

    startBtn.addEventListener("click", openCamera);

    // ==========================================
    // GET DEVICE LOCATION
    // ==========================================
    function getCurrentLocation() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error("This browser does not support location access."));
          return;
        }

        navigator.geolocation.getCurrentPosition(
          position => {
            const { latitude, longitude, accuracy } = position.coords;

            if (
              !Number.isFinite(latitude) ||
              !Number.isFinite(longitude)
            ) {
              reject(new Error("The device returned invalid coordinates."));
              return;
            }

            resolve({
              latitude,
              longitude,
              accuracy,
              timestamp: position.timestamp
            });
          },
          error => {
            const messages = {
              1: "Location permission denied. Allow location access and try again.",
              2: "Your location is unavailable. Enable device location and retry.",
              3: "Location request timed out. Try again outdoors."
            };

            reject(new Error(
              messages[error.code] || "Could not obtain your location."
            ));
          },
          {
            enableHighAccuracy: true,
            timeout: 30000,
            maximumAge: 0
          }
        );
      });
    }

    // ==========================================
    // ADD GPS TO JPEG EXIF
    // ==========================================
    async function addGpsExif(blob, location) {
      if (!window.piexif) {
        throw new Error("EXIF library failed to load. Refresh the page.");
      }

      if (blob.type && blob.type.toLowerCase() !== "image/jpeg") {
        throw new Error(
          "Camera did not return a JPEG. Cannot safely add JPEG EXIF GPS."
        );
      }

      const buffer = await blob.arrayBuffer();
      const bytes = new Uint8Array(buffer);

      // Convert bytes to a binary string in chunks.
      let binary = "";
      const chunkSize = 0x8000;

      for (let i = 0; i < bytes.length; i += chunkSize) {
        binary += String.fromCharCode(
          ...bytes.subarray(i, i + chunkSize)
        );
      }

      // Confirm this is a JPEG.
      if (bytes[0] !== 0xFF || bytes[1] !== 0xD8) {
        throw new Error("The captured file is not a valid JPEG.");
      }

      let exif;

      try {
        exif = piexif.load(binary);
      } catch (_) {
        // Some camera JPEGs contain no existing EXIF block.
        exif = {
          "0th": {},
          "Exif": {},
          "GPS": {},
          "1st": {},
          "thumbnail": null
        };
      }

      exif["0th"] = exif["0th"] || {};
      exif["Exif"] = exif["Exif"] || {};
      exif["GPS"] = exif["GPS"] || {};

      const gps = exif["GPS"];
      const lat = location.latitude;
      const lon = location.longitude;

      gps[piexif.GPSIFD.GPSVersionID] = [2, 3, 0, 0];

      gps[piexif.GPSIFD.GPSLatitudeRef] =
        lat < 0 ? "S" : "N";

      gps[piexif.GPSIFD.GPSLatitude] =
        piexif.GPSHelper.degToDmsRational(Math.abs(lat));

      gps[piexif.GPSIFD.GPSLongitudeRef] =
        lon < 0 ? "W" : "E";

      gps[piexif.GPSIFD.GPSLongitude] =
        piexif.GPSHelper.degToDmsRational(Math.abs(lon));

      // Record the reported horizontal accuracy when available.
      if (Number.isFinite(location.accuracy)) {
        gps[piexif.GPSIFD.GPSHPositioningError] = [
          Math.round(location.accuracy * 100),
          100
        ];
      }

      // EXIF GPS timestamp is stored in UTC.
      const gpsDate = new Date(location.timestamp);

      gps[piexif.GPSIFD.GPSDateStamp] =
        gpsDate.toISOString().slice(0, 10).replaceAll("-", ":");

      gps[piexif.GPSIFD.GPSTimeStamp] = [
        [gpsDate.getUTCHours(), 1],
        [gpsDate.getUTCMinutes(), 1],
        [gpsDate.getUTCSeconds(), 1]
      ];

      // Insert GPS tags while retaining other readable EXIF tags.
      const exifBytes = piexif.dump(exif);
      const modifiedBinary = piexif.insert(exifBytes, binary);

      const output = new Uint8Array(modifiedBinary.length);

      for (let i = 0; i < modifiedBinary.length; i++) {
        output[i] = modifiedBinary.charCodeAt(i);
      }

      return new Blob([output], { type: "image/jpeg" });
    }

    // ==========================================
    // CAPTURE PHOTO AND EMBED GPS
    // ==========================================
    takeBtn.addEventListener("click", async () => {
      if (!imageCapture) {
        setStatus("Still-photo capture is not available in this browser.");
        return;
      }

      takeBtn.disabled = true;

      try {
        setStatus("Getting your current GPS location... ♡");

        // Require a real location result; do not invent coordinates.
        const location = await getCurrentLocation();

        setStatus("Capturing full-resolution photo... ♡");

        const originalBlob = await imageCapture.takePhoto();

        if (!originalBlob || !originalBlob.size) {
          throw new Error("The camera returned an empty photo.");
        }

        setStatus("Writing GPS coordinates into EXIF... ♡");

        const gpsPhoto = await addGpsExif(originalBlob, location);

        // Save only the GPS-tagged JPEG for preview and upload.
        photoBlob = gpsPhoto;
        capturedLocation = location;

        revokePreviewUrl();
        photoUrl = URL.createObjectURL(photoBlob);
        preview.src = photoUrl;

        preview.hidden = false;
        camera.hidden = true;

        stopCamera();

        takeBtn.hidden = true;
        retakeBtn.hidden = false;
        consentLabel.hidden = false;
        sendBtn.hidden = false;
        startBtn.hidden = true;

        const sizeMB = (photoBlob.size / (1024 * 1024)).toFixed(2);

        setStatus(
          `GPS added ♡ ${sizeMB} MB. Location accuracy reported: ±${Math.round(location.accuracy)} m. Review and approve before sending.`
        );

        updateSend();
      } catch (error) {
        setStatus(error.message || "Photo capture failed.");
      } finally {
        takeBtn.disabled = false;
      }
    });

    // ==========================================
    // RETAKE
    // ==========================================
    retakeBtn.addEventListener("click", openCamera);

    consent.addEventListener("change", updateSend);

    // ==========================================
    // SEND JPEG AS A TELEGRAM DOCUMENT
    // ==========================================
    sendBtn.addEventListener("click", async () => {
      if (!photoBlob || !capturedLocation || !consent.checked) {
        setStatus("Capture a photo with GPS and approve sending first.");
        return;
      }

      if (
        BOT_TOKEN === "YOUR_TELEGRAM_BOT_TOKEN" ||
        CHAT_ID === "YOUR_CHAT_ID"
      ) {
        setStatus("Add your Telegram bot token and chat ID in the code.");
        return;
      }

      sendBtn.disabled = true;
      retakeBtn.disabled = true;

      try {
        setStatus("Sending GPS-tagged photo to Telegram... ♡");

        const form = new FormData();

        form.append("chat_id", CHAT_ID);
        form.append(
          "document",
          photoBlob,
          `pink-moment-${Date.now()}.jpg`
        );

        const response = await fetch(
          `https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`,
          {
            method: "POST",
            body: form
          }
        );

        const result = await response.json();

        if (!response.ok || !result.ok) {
          throw new Error(
            result.description || "Telegram upload failed."
          );
        }

        setStatus("Sent successfully! Your GPS-tagged JPEG is in Telegram ♡");
      } catch (error) {
        setStatus(
          error.message ||
          "Could not send the photo. Check your connection and bot settings."
        );
      } finally {
        sendBtn.disabled = false;
        retakeBtn.disabled = false;
        updateSend();
      }
    });

    // Stop the camera when the page is being left.
    window.addEventListener("pagehide", stopCamera);
  </script>
</body>
</html>
